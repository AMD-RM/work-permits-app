    <div>
      <h1>تصاريح العمل</h1>
      <p>Elsewedy Polymers · Work Permit System</p>
    </div>
    <button id="installBtn" class="install-btn" style="display:none;" onclick="triggerInstall()">⬇ تثبيت التطبيق</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabWorker" onclick="switchTab('worker')">📋 نموذج طلب</div>
    <div class="tab" id="tabTrack" onclick="switchTab('track')">🔍 تتبع طلبي</div>
    <div class="tab" id="tabSup" onclick="switchTab('sup')">🛡️ لوحة المشرف</div>
  </div>

  <!-- WORKER VIEW -->
  <div id="viewWorker">
    <div id="formArea"></div>
  </div>

  <!-- TRACK VIEW -->
  <div id="viewTrack" style="display:none;">
    <div class="ticket">
      <div class="ticket-head">
        <span class="ttype">تتبع حالة الطلب</span>
        <span class="tnum">TRACK REQUEST</span>
      </div>
      <div class="perf"></div>
      <div class="ticket-body">
        <div class="field">
          <label>رقم التصريح (اللي وصلك بعد الإرسال)</label>
          <input id="track_id" type="text" placeholder="مثال: WP-2026-0001">
        </div>
        <p style="text-align:center;color:var(--muted);font-size:12.5px;margin:2px 0 12px;">أو</p>
        <div class="field">
          <label>رقم تليفونك (اللي كتبته وقت الطلب)</label>
          <input id="track_phone" type="tel" placeholder="01xxxxxxxxx">
        </div>
        <button class="submit-btn" onclick="trackPermits()">استعلام</button>
        <div id="trackResults" style="margin-top:16px;"></div>
      </div>
    </div>
  </div>

  <!-- SUPERVISOR VIEW -->
  <div id="viewSup" style="display:none;">
    <div id="loginGate"></div>
    <div id="supDashboard" style="display:none;">
      <div class="sup-header-row">
        <h3>🛡️ لوحة المشرف</h3>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
      </div>
      <button class="settings-link" onclick="toggleSettings()">⚙ تغيير بيانات الدخول</button>
      <div class="settings-box" id="settingsBox">
        <div class="field"><label>اسم المستخدم الجديد</label><input id="newUser" type="text"></div>
        <div class="field"><label>كلمة المرور الجديدة</label><input id="newPass" type="password"></div>
        <button class="settings-save" onclick="saveCredentials()">حفظ</button>
        <div class="login-error" id="settingsMsg" style="color:var(--success);"></div>
      </div>

      <div class="toolbar">
        <div class="filters" id="typeFilters"></div>
      </div>
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <button class="export-btn" onclick="exportExcel()">⬇ تصدير Excel</button>
      </div>
      <div id="supList"><div class="loading">جارِ التحميل…</div></div>
    </div>
  </div>

</div>



<script src="app.js"></script>
</body>
</html>
